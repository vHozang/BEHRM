server {
    listen 80;
    listen [::]:80;
    server_name devtapcode.io.vn www.devtapcode.io.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name devtapcode.io.vn www.devtapcode.io.vn;

    ssl_certificate /etc/letsencrypt/live/devtapcode.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devtapcode.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 64M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    charset utf-8;

    # Laravel owns the API namespace; all other routes belong to the Vue SPA.
    location = /api {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /assets/ {
        root /var/www/frontend;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }

    location = /index.php {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
