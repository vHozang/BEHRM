services:
  php:
    image: hrm-laravel-php:local
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: hrm_laravel_php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - hrm_network

  worker:
    image: hrm-laravel-php:local
    container_name: hrm_laravel_worker
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=1 --tries=1 --timeout=600
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - hrm_network

  scheduler:
    image: hrm-laravel-php:local
    container_name: hrm_laravel_scheduler
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - hrm_network

  nginx:
    image: nginx:alpine
    container_name: hrm_laravel_nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped
    networks:
      - hrm_network

  postgres:
    image: postgres:15-alpine
    container_name: hrm_postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: hrm
      POSTGRES_USER: hrm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hrm_network

  redis:
    image: redis:alpine
    container_name: hrm_redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hrm_network

  resume-backend:
    profiles: [resume]
    image: hrm-resume-backend:local
    build:
      context: ../../AutoRecruit-main
      dockerfile: Dockerfile
    container_name: resume-backend
    environment:
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: mxbai-embed-large
      DATA_DIR: /data
    ports:
      - "${RESUME_BIND_IP:-127.0.0.1}:8000:8000"
    volumes:
      - ../../AutoRecruit-main/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hrm_network

networks:
  hrm_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
