name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend checks
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          npm run test:csv
          npm run test:lookup-cache
          npm run test:recruitment
          npm run test:employee-self-service
          npm run test:management-ui
          npm run test:money-input
          npm run test:payslips
          npm run build

      - name: Run attendance bridge checks
        run: npm test --prefix tools/zk-bridge

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Doan2_v2/Doan2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, exif, mbstring, pcntl, pdo, pdo_pgsql, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Laravel tests
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --without-tty

      - name: Validate Docker Compose
        run: docker compose config --quiet

  resume-ai:
    name: Resume AI checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AutoRecruit-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: AutoRecruit-main/app/requirements.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r app/requirements.txt

      - name: Run objective scoring tests
        env:
          MINERU_URL: ''
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate MinerU skill scripts
        run: bash -n ../docs/resume/mineru-resume-local/scripts/*.sh

      - name: Validate resume compose
        run: docker compose config --quiet
