name: Deploy production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for CI on this commit
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const deadline = Date.now() + 20 * 60 * 1000;
            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                branch: 'production',
                head_sha: context.sha,
                per_page: 20,
              });
              const run = response.data.workflow_runs.find(item => item.name === 'CI');
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed(`CI failed with conclusion: ${run.conclusion}`);
                }
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Timed out waiting for the CI workflow');

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy production branch
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          set -Eeuo pipefail
          ssh -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'DEPLOY_PATH=/opt/hrm bash -s' <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          APP_DIR="${DEPLOY_PATH:-/opt/hrm}"
          REPO_URL="https://github.com/vHozang/BEHRM.git"

          if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$(dirname "$APP_DIR")"
            git clone --branch production --single-branch "$REPO_URL" "$APP_DIR"
          else
            git -C "$APP_DIR" fetch --prune origin production
            git -C "$APP_DIR" checkout production
            git -C "$APP_DIR" reset --hard origin/production
          fi

          cd "$APP_DIR"
          bash deploy/deploy-production.sh
          REMOTE_SCRIPT
