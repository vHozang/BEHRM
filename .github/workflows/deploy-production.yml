name: Deploy production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  VPS_HOST: 180.93.42.137
  VPS_USER: deloy
  VPS_PORT: '22'
  VPS_HOST_RSA_FINGERPRINT: SHA256:OV1H5DnXvuWBHHoMg4ep36Mk0dNCwMXSu1Yndpyr2jA

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for CI on this commit
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const deadline = Date.now() + 20 * 60 * 1000;
            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                branch: 'production',
                head_sha: context.sha,
                per_page: 20,
              });
              const run = response.data.workflow_runs.find(item => item.name === 'CI');
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed(`CI failed with conclusion: ${run.conclusion}`);
                }
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Timed out waiting for the CI workflow');

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run build
          tar -C dist/public -czf "$RUNNER_TEMP/hrm-frontend.tar.gz" .

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          scanned_key="$(ssh-keyscan -T 10 -t rsa "$VPS_HOST" 2>/dev/null)"
          if [ -z "$scanned_key" ]; then
            echo "Unable to read the VPS RSA host key" >&2
            exit 1
          fi

          actual_fingerprint="$(printf '%s\n' "$scanned_key" | ssh-keygen -lf - | awk 'NR == 1 {print $2}')"
          if [ "$actual_fingerprint" != "$VPS_HOST_RSA_FINGERPRINT" ]; then
            echo "VPS host key fingerprint mismatch: $actual_fingerprint" >&2
            exit 1
          fi

          printf '%s\n' "$scanned_key" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy production branch
        run: |
          set -Eeuo pipefail
          ssh-add -l
          remote_frontend_archive="/tmp/hrm-frontend-${GITHUB_SHA}.tar.gz"
          scp -P "$VPS_PORT" \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/hrm-frontend.tar.gz" \
            "$VPS_USER@$VPS_HOST:$remote_frontend_archive"

          ssh -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_PATH=/opt/hrm FRONTEND_ARCHIVE=$remote_frontend_archive bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          APP_DIR="${DEPLOY_PATH:-/opt/hrm}"
          REPO_URL="https://github.com/vHozang/BEHRM.git"

          if [ ! -s "$FRONTEND_ARCHIVE" ]; then
            echo "Missing uploaded frontend archive: $FRONTEND_ARCHIVE" >&2
            exit 1
          fi

          trap 'rm -f "$FRONTEND_ARCHIVE"' EXIT

          if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$(dirname "$APP_DIR")"
            git clone --branch production --single-branch "$REPO_URL" "$APP_DIR"
          else
            git -C "$APP_DIR" fetch --prune origin production
            git -C "$APP_DIR" checkout production
            git -C "$APP_DIR" reset --hard origin/production
          fi

          FRONTEND_DIR="$APP_DIR/dist/public"
          mkdir -p "$FRONTEND_DIR"
          find "$FRONTEND_DIR" -mindepth 1 -depth -delete
          tar -xzf "$FRONTEND_ARCHIVE" -C "$FRONTEND_DIR"
          test -s "$FRONTEND_DIR/index.html"

          cd "$APP_DIR"
          bash deploy/deploy-production.sh
          REMOTE_SCRIPT
