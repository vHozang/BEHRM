[databases]
; ════════════════════════════════════════════════════════════════════════
; PgBouncer Configuration for HRM System
; File: docker/pgbouncer/pgbouncer.ini
;
; PgBouncer là connection pooler cho PostgreSQL:
;   Client App ──(nhiều connections)──> PgBouncer ──(ít connections)──> PostgreSQL
;   Laravel Workers: 50 workers x 5 conn = 250 connections tối đa
;   PgBouncer pool: chỉ cần 30-50 connections thật đến PostgreSQL
;
; Pooling Modes:
;   session    : 1 client = 1 DB connection trong suốt session (giống không có pooler)
;   transaction: 1 client dùng connection chỉ khi có transaction đang chạy (RECOMMENDED)
;   statement  : 1 client dùng connection trong từng câu SQL (không hỗ trợ multi-statement)
;
; KHUYẾN NGHỊ: transaction mode cho Laravel Queue workers
; ════════════════════════════════════════════════════════════════════════

; Database mapping: tên alias trong app → database thật trong PostgreSQL
hrm = host=postgres port=5432 dbname=hrm

; Bạn có thể thêm read replica ở đây:
; hrm_read = host=postgres-replica port=5432 dbname=hrm

[pgbouncer]
; ─── Network ───────────────────────────────────────────────────────────
listen_addr     = 0.0.0.0
listen_port     = 6432          ; PgBouncer lắng nghe port 6432 (không phải 5432)
unix_socket_dir = /var/run/postgresql

; ─── Authentication ────────────────────────────────────────────────────
auth_type       = scram-sha-256 ; Bảo mật hơn md5 (PostgreSQL 10+)
auth_file       = /etc/pgbouncer/userlist.txt

; ─── Pool Configuration ────────────────────────────────────────────────
; pool_mode = transaction: Phù hợp nhất với Laravel Queue workers
; Mỗi worker chỉ "giữ" connection trong thời gian execute SQL, trả lại ngay khi xong.
; 50 workers có thể share 20 connections thật → tiết kiệm 30 connections.
pool_mode       = transaction

; Số connection thật tối đa đến PostgreSQL (từ PgBouncer)
; PostgreSQL mặc định max_connections = 100, để lại buffer cho admin connections
max_client_conn = 500           ; Tối đa 500 client kết nối đến PgBouncer
default_pool_size = 25          ; Mỗi database: tối đa 25 connections thật
min_pool_size   = 5             ; Luôn giữ ít nhất 5 connections sẵn sàng
reserve_pool_size = 5           ; 5 connections dự phòng cho burst traffic
reserve_pool_timeout = 3.0      ; Thời gian chờ lấy reserve connection (giây)

; ─── Timeouts ──────────────────────────────────────────────────────────
server_idle_timeout   = 600     ; Đóng connection server idle > 10 phút
client_idle_timeout   = 60      ; Đóng connection client idle > 1 phút  
query_timeout         = 30      ; Kill query chạy > 30 giây
query_wait_timeout    = 10      ; Timeout nếu chờ connection > 10 giây
connect_timeout       = 5       ; Timeout khi kết nối đến PostgreSQL

; ─── Logging ───────────────────────────────────────────────────────────
log_connections = 0             ; Tắt log mỗi connection (quá nhiều)
log_disconnections = 0
log_pooler_errors = 1           ; Vẫn log lỗi quan trọng
stats_period    = 60            ; Log thống kê mỗi 60 giây

; ─── Admin ─────────────────────────────────────────────────────────────
admin_users     = pgbouncer_admin
stats_users     = pgbouncer_stats

; ─── TLS ───────────────────────────────────────────────────────────────
; Bật TLS cho production
; server_tls_sslmode = require
; server_tls_ca_file = /etc/ssl/certs/ca-bundle.crt
